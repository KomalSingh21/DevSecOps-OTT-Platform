kind: Service
apiVersion: v1
metadata:
  name: node-exporter
  namespace: prometheus-node-exporter
spec:
  selector:
      app: node-exporter
  ports:
  - name: node-exporter
    protocol: TCP
    port: 9100
    targetPort: 9100
  type: NodePort
  # NodePort is used for this lab/demo deployment.
  # For production on AWS EKS, consider using LoadBalancer
  # or an Ingress controller for external access.